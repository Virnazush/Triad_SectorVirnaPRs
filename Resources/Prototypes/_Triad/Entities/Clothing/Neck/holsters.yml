- type: entity
  parent: BaseClothingNeckHolster
  id: ClothingBeltHolster #Triad cannot change ID or else it will break everything using the OG shoulder holster
  name: shoulder holster
  description: 'A holster to carry a handgun and ammo. WARNING: Badasses only.'
  components:
  - type: Sprite
    sprite: _Triad/Clothing/Neck/holster_shoulder.rsi/
    layers:
    - state: icon
  - type: Clothing
    sprite: _Triad/Clothing/Neck/holster_shoulder.rsi/
    clothingVisuals:
      neck:
      - state: equipped-NECK
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right

- type: entity
  parent: BaseClothingNeckHolster
  id: ClothingBeltSyndieHolster #Triad cannot change ID or else it will break everything using the OG syndie shoulder holster
  name: syndicate shoulder holster
